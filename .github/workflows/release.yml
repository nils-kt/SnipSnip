name: Release

# Ein Release entsteht durch das Pushen eines Versions-Tags, z. B.:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags mit Bindestrich (v1.1.0-beta.1) werden als Pre-Release veröffentlicht.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          $common = @('-c', 'Release', '-p:PublishSingleFile=true', "-p:Version=$v", '-p:DebugType=none')

          # Eigenständig (keine .NET-Installation nötig)
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish @common -r $rid --self-contained true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "publish $rid failed" }
            Compress-Archive -Path "out/$rid/SnipSnip.exe" -DestinationPath "dist/SnipSnip-$v-$rid.zip"
          }

          # Klein (benötigt die .NET 10 Desktop Runtime)
          dotnet publish @common -r win-x64 --self-contained false -o out/fd
          if ($LASTEXITCODE -ne 0) { throw 'publish framework-dependent failed' }
          Compress-Archive -Path out/fd/SnipSnip.exe -DestinationPath "dist/SnipSnip-$v-win-x64-requires-dotnet10.zip"

          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SnipSnip ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
